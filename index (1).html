<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Хозяйка Медной горы — Интерактивный сказ</title>
  <style>
    /* Reset & iOS Safe Layout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-dark: #05140e;
      --card-bg: rgba(7, 24, 17, 0.96);
      --copper: #c87445;
      --copper-light: #e59367;
      --gold: #d4af37;
      --malachite: #2ee695;
      --malachite-dim: #135e3d;
      --text-main: #f5f8f2;
      --text-muted: #95a89c;
      --border-copper: rgba(200, 116, 69, 0.45);
      --font-serif: "Georgia", "Palatino", "Times New Roman", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --safe-bottom: env(safe-area-inset-bottom, 16px);
      --safe-top: env(safe-area-inset-top, 16px);
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-serif);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      justify-content: center;
      align-items: stretch;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(20, 68, 48, 0.6) 0%, transparent 70%),
        radial-gradient(circle at 80% 90%, rgba(200, 116, 69, 0.15) 0%, transparent 60%);
    }

    html {
      height: -webkit-fill-available;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #071912 0%, #030c08 100%);
      position: relative;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(200, 116, 69, 0.25);
    }

    /* Top Bar */
    header {
      padding: calc(var(--safe-top) + 6px) 16px 8px;
      background: linear-gradient(180deg, rgba(5, 20, 14, 0.98) 0%, rgba(5, 20, 14, 0.85) 100%);
      border-bottom: 1px solid var(--border-copper);
      z-index: 30;
      position: sticky;
      top: 0;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .story-title {
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--copper-light);
      text-transform: uppercase;
      font-weight: 700;
    }

    .step-counter {
      font-family: var(--font-sans);
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(46, 230, 149, 0.1);
      border: 1px solid rgba(46, 230, 149, 0.3);
      padding: 3px 8px;
      border-radius: 12px;
    }

    /* Inventory */
    .inventory-bar {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed rgba(200, 116, 69, 0.25);
    }

    .inv-item {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(10, 38, 26, 0.8);
      border: 1px solid rgba(200, 116, 69, 0.35);
      padding: 3px 8px;
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 11px;
      color: var(--text-main);
    }

    .inv-status {
      color: var(--malachite);
      font-size: 10px;
      font-weight: 600;
      margin-left: 2px;
    }

    .inv-status.cold {
      color: #8da2b0;
    }

    /* Main Scroll Area */
    main {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 14px 170px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Scene Illustration Frame */
    .scene-frame {
      position: relative;
      width: 100%;
      height: 200px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--border-copper);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      flex-shrink: 0;
      background: #030a07;
    }

    .scene-frame svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .scene-tag {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 18px 12px 6px;
      background: linear-gradient(180deg, transparent 0%, rgba(3, 12, 8, 0.95) 80%);
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--copper-light);
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Dialog Log */
    .dialog-log {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 13px 15px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 16px;
    }

    .msg-narrator {
      background: var(--card-bg);
      border-left: 3px solid var(--copper);
      border-top: 1px solid rgba(200, 116, 69, 0.2);
      border-right: 1px solid rgba(200, 116, 69, 0.15);
      border-bottom: 1px solid rgba(200, 116, 69, 0.15);
      color: var(--text-main);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .msg-narrator p {
      margin-bottom: 10px;
    }

    .msg-narrator p:last-child {
      margin-bottom: 0;
    }

    .msg-narrator .prompt-question {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(200, 116, 69, 0.3);
      font-style: italic;
      color: var(--copper-light);
      font-weight: 600;
    }

    .msg-player {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(46, 230, 149, 0.2) 0%, rgba(10, 38, 26, 0.9) 100%);
      border: 1px solid rgba(46, 230, 149, 0.4);
      color: #eafaf1;
      max-width: 90%;
      font-size: 15px;
      font-style: italic;
    }

    .msg-system-roll {
      background: rgba(200, 116, 69, 0.15);
      border: 1px solid var(--copper);
      padding: 9px 13px;
      border-radius: 10px;
      font-family: var(--font-sans);
      font-size: 12px;
      color: var(--copper-light);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Bottom Control Bar */
    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 12px calc(var(--safe-bottom) + 8px);
      background: linear-gradient(180deg, rgba(7, 24, 17, 0.9) 0%, rgba(4, 13, 9, 0.98) 40%);
      border-top: 1px solid var(--border-copper);
      z-index: 40;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hints-container {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .hints-container::-webkit-scrollbar {
      display: none;
    }

    .hint-chip {
      white-space: nowrap;
      background: rgba(10, 38, 26, 0.9);
      border: 1px solid rgba(200, 116, 69, 0.45);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 11px;
      padding: 7px 12px;
      border-radius: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .hint-chip:active {
      background: var(--copper);
      color: #fff;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .text-input-wrap {
      flex: 1;
    }

    input[type="text"] {
      width: 100%;
      height: 44px;
      background: rgba(4, 13, 9, 0.92);
      border: 1px solid var(--border-copper);
      border-radius: 10px;
      padding: 0 12px;
      font-family: var(--font-serif);
      font-size: 16px;
      color: var(--text-main);
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--copper-light);
    }

    input[type="text"]:disabled {
      opacity: 0.5;
      background: rgba(10, 20, 15, 0.6);
    }

    .btn-send {
      height: 44px;
      padding: 0 16px;
      background: linear-gradient(135deg, var(--copper) 0%, #8e4722 100%);
      border: 1px solid var(--copper-light);
      border-radius: 10px;
      color: #fff;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Dice Prompt Banner */
    .dice-prompt-banner {
      display: none;
      background: linear-gradient(135deg, rgba(200, 116, 69, 0.35) 0%, rgba(10, 38, 26, 0.95) 100%);
      border: 1px solid var(--copper-light);
      padding: 9px 12px;
      border-radius: 10px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .dice-prompt-text {
      font-size: 13px;
      color: #ffeedb;
      line-height: 1.25;
      flex: 1;
    }

    .btn-roll-cube {
      background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
      border: 1px solid #ffd700;
      color: #06150f;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Dice Overlay */
    .dice-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(2, 8, 5, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100;
    }

    .dice-box {
      width: 86px;
      height: 86px;
      background: linear-gradient(145deg, #2b170c, #150903);
      border: 2px solid var(--copper-light);
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      color: #ffd700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 25px rgba(200, 116, 69, 0.6);
    }

    .dice-result-label {
      margin-top: 16px;
      font-size: 18px;
      color: var(--copper-light);
      text-align: center;
      padding: 0 16px;
    }

    /* Bottom Sheet: Voice of Nastasya */
    .bottom-sheet-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 80;
      display: none;
    }

    .bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translate(-50%, 100%);
      width: 100%;
      max-width: 480px;
      background: linear-gradient(180deg, #13241b 0%, #09130e 100%);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border: 1px solid var(--border-copper);
      border-bottom: none;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.85);
      z-index: 90;
      padding: 10px 16px calc(var(--safe-bottom) + 12px);
      transition: transform 0.35s ease;
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(200, 116, 69, 0.4);
      border-radius: 2px;
      margin: 0 auto 10px;
    }

    .sheet-illustration {
      width: 100%;
      height: 130px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
      border: 1px solid rgba(200, 116, 69, 0.3);
      background: #0d1712;
    }

    .sheet-illustration svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .sheet-text {
      font-size: 15px;
      line-height: 1.45;
      color: #f1ede2;
      font-style: italic;
      margin-bottom: 12px;
    }

    .btn-sheet-close {
      width: 100%;
      height: 40px;
      background: rgba(200, 116, 69, 0.25);
      border: 1px solid var(--copper);
      color: var(--copper-light);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Final Modal */
    .final-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 10, 7, 0.96);
      z-index: 200;
      display: none;
      padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 16px);
      overflow-y: auto;
      flex-direction: column;
      align-items: center;
    }

    .final-card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #0e2b1f 0%, #06150f 100%);
      border: 2px solid var(--copper);
      border-radius: 16px;
      padding: 20px 16px;
      text-align: center;
    }

    .final-title {
      font-size: 18px;
      color: var(--copper-light);
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .final-divider {
      width: 50px;
      height: 2px;
      background: var(--copper);
      margin: 0 auto 14px;
    }

    .final-moral {
      font-size: 15px;
      line-height: 1.5;
      color: #eff3ea;
      margin-bottom: 14px;
      text-align: justify;
    }

    .final-compare {
      background: rgba(4, 13, 9, 0.7);
      border: 1px solid rgba(200, 116, 69, 0.25);
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.4;
      color: #c4d4c8;
      text-align: left;
      margin-bottom: 18px;
    }

    .btn-restart {
      width: 100%;
      height: 44px;
      background: linear-gradient(135deg, var(--copper) 0%, #8e4722 100%);
      border: 1px solid var(--copper-light);
      color: #fff;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 13px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- Header -->
  <header>
    <div class="header-top">
      <div class="story-title">Хозяйка Медной горы</div>
      <div class="step-counter" id="stepCounter">Ход 1 / 8</div>
    </div>
    
    <!-- Inventory -->
    <div class="inventory-bar">
      <div class="inv-item">
        <span>🎯</span>
        <span>Дробовик:</span>
        <span class="inv-status" id="gunStatus">в руках</span>
      </div>
      <div class="inv-item">
        <span>💎</span>
        <span>Слёзы Хозяйки:</span>
        <span class="inv-status" id="tearsStatus">теплятся</span>
      </div>
    </div>
  </header>

  <!-- Story Scroll Area -->
  <main id="mainScroll">
    <!-- Visual Scene Frame -->
    <div class="scene-frame">
      <div id="sceneSvgContainer"></div>
      <div class="scene-tag">
        <span id="sceneLocation">Изба Степана</span>
        <span id="sceneTime">Рассвет</span>
      </div>
    </div>

    <!-- Dialog Feed -->
    <div class="dialog-log" id="dialogLog"></div>
  </main>

  <!-- Bottom Interactive Deck -->
  <footer>
    <!-- Dice Prompt Banner -->
    <div class="dice-prompt-banner" id="diceBanner">
      <div class="dice-prompt-text">Это рискованный шаг. Везение Степана нужно проверить, брось кубик.</div>
      <button type="button" class="btn-roll-cube" id="btnRollDice">
        <span>🎲 Бросить d6</span>
      </button>
    </div>

    <!-- Contextual Action Chips -->
    <div class="hints-container" id="hintsContainer"></div>

    <!-- Text Input -->
    <div class="input-row">
      <div class="text-input-wrap">
        <input type="text" id="actionInput" placeholder="Что сделает Степан?.." autocomplete="off" autocapitalize="none">
      </div>
      <button type="button" class="btn-send" id="btnSend">Ход →</button>
    </div>
  </footer>
</div>

<!-- Dice Animation Modal -->
<div class="dice-overlay" id="diceOverlay">
  <div class="dice-box" id="diceBox">6</div>
  <div class="dice-result-label" id="diceResultLabel">Бросаем кость...</div>
</div>

<!-- Bottom Sheet: Voice of Nastasya -->
<div class="bottom-sheet-overlay" id="sheetOverlay"></div>
<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-illustration" id="sheetSvgContainer"></div>
  <div class="sheet-text" id="sheetText"></div>
  <button type="button" class="btn-sheet-close" id="btnSheetClose">Вернуться к Степану</button>
</div>

<!-- Final Modal -->
<div class="final-modal" id="finalModal">
  <div class="final-card">
    <div class="final-title" id="finalTitle">Сказ завершён</div>
    <div class="final-divider"></div>
    <div class="final-moral" id="finalMoral"></div>
    <div class="final-compare" id="finalCompare"></div>
    <button type="button" class="btn-restart" id="btnRestart">Начать сказ заново</button>
  </div>
</div>

<script>
/* =========================================================================
   AUTHENTIC URAL SKAZ GRAPHICS (Stylized Tempera & Malachite Book Illustrations)
   ========================================================================= */
var ArtTemplates = {
  // 1. Изба: сумеречная синева окна, золотисто-медный жар русской печи, кованая утварь
  cabin: '<svg viewBox="0 0 400 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">' +
    '<defs>' +

  // 2. Дремучий осенний бор: могучие сосны, алая рябина, мшистые увалы, изумрудная дымка
  forest: '<svg viewBox="0 0 400 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">' +
    '<defs>' +

    '<path d="M15,120 L-25,145 M25,100 L75,115 M20,70 L-20,85 M22,45 L65,58" stroke="#123a28" stroke-width="5" stroke-linecap="round"/>' +

  init: function() {

    this.updateStatus();
    this.renderHints(1);
    
    var intro = "Ранний рассвет студит оконце уральской избы. Степан стоит у порога в старой сермяге, сжимая дробовичок. В груди дышится тяжело, а за пазухой холодит ребра потайной узелок со слезами-изумрудами Хозяйки.\n\nНастасья отрывается от печного жара, вытирает передником белые руки и с тревогой глядит в лицо мужу:\n— Степанушко... Куда ж ты в такую сырость, чуть свет? Аль опять на заброшенную Красногорку душа тянет?";
    var question = "Что ответит Степан жене у дверей?";
    this.appendNarratorMessage(intro, question);

    this.bindEvents();
  },

  bindEvents: function() {
    var self = this;
    var input = document.getElementById("actionInput");
    var btnSend = document.getElementById("btnSend");
    var btnRollDice = document.getElementById("btnRollDice");
    var btnSheetClose = document.getElementById("btnSheetClose");
    var sheetOverlay = document.getElementById("sheetOverlay");
    var btnRestart = document.getElementById("btnRestart");

    function handleSend() {
      var text = input.value.trim();
      if (!text || self.awaitingDice) return;
      input.value = "";
      self.processPlayerAction(text);
    }

    // Both click and touch support for reliable execution on iOS
    btnSend.addEventListener("click", handleSend);
    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") handleSend();
    });

    btnRollDice.addEventListener("click", function() {
      if (!self.awaitingDice) return;
      self.executeDiceRoll();
    });

    btnSheetClose.addEventListener("click", function() {
      self.closeBottomSheet();
    });

    sheetOverlay.addEventListener("click", function() {
      self.closeBottomSheet();
    });

    btnRestart.addEventListener("click", function() {
      window.location.reload();
    });
  },

  renderScene: function(step) {
    var loc = this.locations[step] || this.locations[8];
    document.getElementById("sceneLocation").textContent = loc.name;
    document.getElementById("sceneTime").textContent = loc.time;
    document.getElementById("sceneSvgContainer").innerHTML = ArtTemplates[loc.template] || ArtTemplates.cabin;
  },

  renderHints: function(step) {
    var self = this;
    var container = document.getElementById("hintsContainer");
    container.innerHTML = "";
    var list = this.contextualHints[step] || [];
    for (var i = 0; i < list.length; i++) {
      (function(hintText) {
        var chip = document.createElement("div");
        chip.className = "hint-chip";
        chip.textContent = hintText;
        chip.addEventListener("click", function() {
          if (self.awaitingDice) return;
          var inp = document.getElementById("actionInput");
          inp.value = hintText;
          inp.focus();
        });
        container.appendChild(chip);
      })(list[i]);
    }
  },

  updateStatus: function() {
    document.getElementById("stepCounter").textContent = "Ход " + this.currentStep + " / " + this.totalSteps;
    document.getElementById("gunStatus").textContent = this.inventory.gun;
    document.getElementById("tearsStatus").textContent = this.inventory.tears;
    
    var tearsEl = document.getElementById("tearsStatus");
    if (this.inventory.tears === "остыли") {
      tearsEl.classList.add("cold");
    } else {
      tearsEl.classList.remove("cold");
    }
  },

  appendPlayerMessage: function(text) {
    var log = document.getElementById("dialogLog");
    var el = document.createElement("div");
    el.className = "message msg-player";
    el.textContent = text;
    log.appendChild(el);
    this.scrollToBottom();
  },

  appendNarratorMessage: function(text, question) {
    var log = document.getElementById("dialogLog");
    var el = document.createElement("div");
    el.className = "message msg-narrator";
    
    var paragraphs = text.split("\n\n");
    for (var i = 0; i < paragraphs.length; i++) {
      var pText = paragraphs[i].trim();
      if (pText) {
        var pEl = document.createElement("p");
        pEl.textContent = pText;
        el.appendChild(pEl);
      }
    }

    if (question) {
      var qEl = document.createElement("div");
      qEl.className = "prompt-question";
      qEl.textContent = question;
      el.appendChild(qEl);
    }

    log.appendChild(el);
    this.scrollToBottom();
  },

  appendSystemRoll: function(text) {
    var log = document.getElementById("dialogLog");
    var el = document.createElement("div");
    el.className = "message msg-system-roll";
    el.innerHTML = "<span>🎲</span><span>" + text + "</span>";
    log.appendChild(el);
    this.scrollToBottom();
  },

  scrollToBottom: function() {
    var main = document.getElementById("mainScroll");
    setTimeout(function() {
      main.scrollTop = main.scrollHeight;
    }, 40);
  },

  processPlayerAction: function(text) {
    this.appendPlayerMessage(text);
    var lower = text.toLowerCase();
    
    // Check risky moves triggering the required dice roll banner
    var isRisky = 
      (this.currentStep === 1 && (lower.indexOf("охот") !== -1 || lower.indexOf("дичь") !== -1 || lower.indexOf("правд") !== -1 || lower.indexOf("красногорк") !== -1)) ||
      (this.currentStep === 3 && (lower.indexOf("выстрел") !== -1 || lower.indexOf("дичь") !== -1 || lower.indexOf("рябчик") !== -1)) ||
      (this.currentStep === 4 && (lower.indexOf("стреля") !== -1 || lower.indexOf("выстрел") !== -1)) ||
      (this.currentStep === 6 && (lower.indexOf("лаз") !== -1 || lower.indexOf("войти") !== -1 || lower.indexOf("шаг") !== -1)) ||
      (this.currentStep === 7 && (lower.indexOf("спор") !== -1 || lower.indexOf("доказ") !== -1 || lower.indexOf("вернул") !== -1));

    if (isRisky) {
      this.pendingUserInput = text;
      this.enableDicePrompt();
      return;
    }

    this.advanceStoryTurn(text, null);
  },

  enableDicePrompt: function() {
    this.awaitingDice = true;
    document.getElementById("actionInput").disabled = true;
    document.getElementById("btnSend").disabled = true;
    document.getElementById("diceBanner").style.display = "flex";
    this.scrollToBottom();
  },

  disableDicePrompt: function() {
    this.awaitingDice = false;
    document.getElementById("actionInput").disabled = false;
    document.getElementById("btnSend").disabled = false;
    document.getElementById("diceBanner").style.display = "none";
  },

  executeDiceRoll: function() {
    var self = this;
    var overlay = document.getElementById("diceOverlay");
    var box = document.getElementById("diceBox");
    var label = document.getElementById("diceResultLabel");

    overlay.style.display = "flex";
    box.textContent = "·";
    label.textContent = "Кость крутится на уральском граните...";

    setTimeout(function() {
      var roll = Math.floor(Math.random() * 6) + 1;
      box.textContent = roll;

      var resultText = "";
      if (roll <= 2) resultText = "Выпало: " + roll + " — Провал. Земля противится замыслу.";
      else if (roll <= 4) resultText = "Выпало: " + roll + " — Успех с потерей. Судьба взяла свою цену.";
      else resultText = "Выпало: " + roll + " — Полная удача. Рок отступил перед волей.";

      label.textContent = resultText;

      setTimeout(function() {
        overlay.style.display = "none";
        self.disableDicePrompt();
        self.appendSystemRoll(resultText);
        self.advanceStoryTurn(self.pendingUserInput, roll);
      }, 1000);
    }, 800);
  },

    }
    else if (step === 7) {
      narratorStory = "Стены чертога переливаются узорчатым малахитом. Перед Степаном восстаёт сама Хозяйка Медной горы в царском уборе. Взор её полон вековечной печали:\n— Зачем пришёл, Степанушко? Я ведь тебя вольным человеком в мир отпустила, наказ дала: «Не вспоминай». От семьи ушёл тайком, дом оставил, а ко мне принёс чужую тревогу да свою тоску?";
      guidingQuestion = "Что скажет Степан подземной владычице?";
    }
    else if (step === 8) {
      if (diceRoll && diceRoll <= 2) {
        this.triggerFinalResolution("petrified");
        return;
      } else {
        this.triggerFinalResolution("canonical");
        return;
      }
    }

    this.updateStatus();
    this.appendNarratorMessage(narratorStory, guidingQuestion);
  },

  checkAndOpenParallelVoice: function(step) {
    var data = this.parallelVoices[step];
    if (!data) return;

    setTimeout(function() {
      var overlay = document.getElementById("sheetOverlay");
      var sheet = document.getElementById("bottomSheet");
      var textEl = document.getElementById("sheetText");
      var svgCont = document.getElementById("sheetSvgContainer");

      textEl.textContent = data.text;
      svgCont.innerHTML = ArtTemplates[data.art] || ArtTemplates.nastasyaDrawer;

      overlay.style.display = "block";
      setTimeout(function() {
        sheet.style.transform = "translate(-50%, 0)";
      }, 20);
    }, 600);
  },

  closeBottomSheet: function() {
    var overlay = document.getElementById("sheetOverlay");
    var sheet = document.getElementById("bottomSheet");

    sheet.style.transform = "translate(-50%, 100%)";
    setTimeout(function() {
      overlay.style.display = "none";
    }, 320);
  },

  triggerFinalResolution: function(type) {
    var modal = document.getElementById("finalModal");
    var title = document.getElementById("finalTitle");
    var moral = document.getElementById("finalMoral");
    var compare = document.getElementById("finalCompare");

    if (type === "petrified") {
      title.textContent = "Суд Горы: Окаменение";
      moral.textContent = "Попытка переложить ответственность за свой уход на стихию не приносит покоя. Степан застывает малахитовым изваянием в недрах рудника. Настасья же, оставшись без мужа, находит в себе силы не падать духом, а самостоятельно вести хозяйство, освобождаясь от наваждения.";
      compare.innerHTML = "<b>Отличие от канона Бажова:</b> В оригинале Степан погибает на поверхности у камня со слезами в руке как страдалец. В вашей игре нарушен запрет на эскапизм: отказ нести ответственность обращает героя в камень.";
    } else {
      title.textContent = "Канонический Исход: Слёзы у Камня";
      moral.textContent = "Степан замирает на границе двух миров — не найдя покоя в семье и не оставшись в подземном чертоге. Женский образ в сказе раскрывается через стойкость: Настасья находит брошенное ружьё и возвращается к людям, продолжая жизнь своим трудом.";
      compare.innerHTML = "<b>Для школьного анализа:</b> Канон Павла Петровича Бажова показывает трагедию человека, застрявшего между чудом и долгом. Наш параллельный фон возвращает Настасье голос и уважение к её труду.";
    }

    modal.style.display = "flex";
  }
};

// Immediate direct boot for iOS + DOMContentLoaded fallback
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", function() { GameEngine.init(); });
} else {
  GameEngine.init();
}
</script>
</body>
</html>
